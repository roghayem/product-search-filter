<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 class="title"><i class="fa-solid fa-bag-shopping"></i>Our Products</h2>
            <input type="text" placeholder="Search products..." id="searhcInput">
        </div>

        <div class="all-catagories">
            <div class="buttons">
            <button class="filter-btn"  data-filter="all">All</button>
            <button class="filter-btn"  data-filter="men">Man</button>
            <button class="filter-btn"  data-filter="women">Woman</button>
            <button class="filter-btn"  data-filter="accessories">Accessories</button>
            </div>
            <select  id="sort">
                <option value="default">Default</option>
                <option value="low">Price : Low to High</option>
                <option value="high">Price : High to Low</option>
            </select>
            </div>

            <div class="cards"></div>
            <div class="message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
